#
# Pull request and main CI. The jobs (Arch, Lint, Nix) are the shared C++ CI
# of the workspace repository (.github/workflows/cpp-ci.yml), which says what
# each one does. This file passes only what differs here.
#
# Afterglow builds the release preset: GCC finds some warnings only at the
# optimisation of a release build, and the tests that time CPU work have thin
# margins at -O0. phosphor-libs comes from the commit
# cmake/AfterglowDependencies.cmake pins. The jobs have no Wayland display, so
# the tests that draw with Vulkan, and the native window suite, do not run
# here (docs/TESTING.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@ci/reusable-workflows
    with:
      pin-file: cmake/AfterglowDependencies.cmake
      preset: release
      build-timeout: 90
      nix-timeout: 90
      nix-verify: |
        for program in afterglow aglow aglow-mux; do
          test -x "result/bin/$program" || { echo "::error::the package installed no $program"; exit 1; }
        done
        test -e result/share/applications/com.phosphorworks.Afterglow.desktop || { echo "::error::the package installed no .desktop file"; exit 1; }
